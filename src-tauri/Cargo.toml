[package]
name = "gik"
version = "0.2.0"
description = "A precise Git workbench"
edition = "2021"

[lib]
name = "gik_core"
path = "src/lib.rs"

[[bin]]
name = "gik"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:portable-pty", "dep:tauri-build", "dep:getrandom"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
portable-pty = { version = "0.9", optional = true }
getrandom = { version = "0.4", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
